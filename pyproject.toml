[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alcanza-check"
version = "1.0.2"
authors = [
  { name = "Ben Subendran", email = "benhanan.subendran@gmail.com" },
]
description = "A comprehensive network connectivity checker CLI (ICMP, TCP, DNS, SSL)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/hanancs/alcanza-check"
Issues = "https://github.com/hanancs/alcanza-check/issues"
Repository = "https://github.com/hanancs/alcanza-check"

[project.scripts]
alcanza-check = "alcanza_check.main:main"

[tool.setuptools.packages.find]
where = ["src"]
